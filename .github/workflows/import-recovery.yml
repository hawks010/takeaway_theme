name: Import consistency recovery
on:
  push:
    branches: [fix/backend-foundations-20260930]
    paths: ['.github/workflows/import-recovery.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-foundations-20260930
      - name: Verify and apply prepared source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = Path('.import-recovery.b64').read_text().replace('Xppp9rS9', 'Xpp9rS9')
          patch = gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == 'a69b1234f7d5afb6002a00f5a90cd46e2618890f92af7b2fd6d82593f881506d'
          Path('/tmp/import-recovery.patch').write_bytes(patch)
          PY
          git apply --check /tmp/import-recovery.patch
          git apply /tmp/import-recovery.patch
          php tests/backend/run.php
          find takeaway-os tests -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add takeaway-os tests
          git rm .import-recovery.b64 .github/workflows/import-recovery.yml
          git commit -m 'Unify customer and menu imports; preserve merchant fields and opt-outs'
          git push origin HEAD:refs/heads/fix/backend-foundations-20260930
