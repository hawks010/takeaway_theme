name: Backend checks
on:
  push:
    branches: [fix/backend-foundations-20260930]
  pull_request:
    paths: ['takeaway-os/**', 'tests/backend/**', '.github/workflows/backend-checks.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP syntax
        run: find takeaway-os -path '*/node_modules' -prune -o -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Backend regression tests
        run: |
          if [ -f tests/backend/run.php ]; then php tests/backend/run.php; else echo 'Baseline capture only; regression tests not yet added.'; fi
      - name: Capture source and checks for review
        if: always()
        run: |
          mkdir -p /tmp/takeaway-review
          git archive --format=tar HEAD takeaway-os takeaway-theme docs scripts STATE_OF_SITE.md TAKEAWAY_OS_PROGRESS.md > /tmp/takeaway-review/source.tar
          git rev-parse HEAD > /tmp/takeaway-review/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-review-source
          path: /tmp/takeaway-review
          retention-days: 7
