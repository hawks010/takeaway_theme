name: Apply prepared shipping correction
on:
  push:
    branches: [fix/backend-foundations-20260930]
    paths: ['.github/workflows/apply-shipping-correction.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-foundations-20260930
      - name: Apply reviewed patch and refresh existing bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess, zipfile
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('.shipping-change.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '774d7356003172bb9aaafe112d25b3974f1cc1026716337dcf4c0ccdd516816f'
          Path('/tmp/shipping-change.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/shipping-change.patch'],check=True)
          subprocess.run(['git','apply','/tmp/shipping-change.patch'],check=True)
          p=Path('.github/workflows/backend-checks.yml'); s=p.read_text()
          marker='      - name: Capture reviewable source without production data\n'
          assert s.count(marker)==1
          step='''      - name: Rehearse shipping and resolved checkout address
                  run: |
                    set -euo pipefail
                    git fetch --depth=1 origin 38c26eb37e9c7eea4d0c6b2961a28ea892de3c84
                    target="$WP_PATH/wp-content/plugins/takeaway-os/includes"
                    restore_candidate() {
                      cp takeaway-os/includes/class-operations.php "$target/class-operations.php"
                      cp takeaway-os/includes/class-features.php "$target/class-features.php"
                    }
                    trap restore_candidate EXIT
                    for file in class-operations.php class-features.php; do
                      git show "38c26eb37e9c7eea4d0c6b2961a28ea892de3c84:takeaway-os/includes/$file" > "$target/$file"
                    done
                    set +e
                    php /tmp/wp-cli.phar --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/native/shipping_assertions.php" > /tmp/shipping-baseline.txt 2>&1
                    baseline_result=$?
                    set -e
                    restore_candidate
                    cat /tmp/shipping-baseline.txt
                    test "$baseline_result" -eq 1
                    grep -F 'SHIPPING RESULT 13 passed, 7 failed, 20 tests' /tmp/shipping-baseline.txt
                    php /tmp/wp-cli.phar --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/native/shipping_assertions.php" | tee /tmp/shipping-candidate.txt
          '''
          # Dedent only the additional Python-string indentation, preserving YAML structure.
          lines=step.splitlines(); step=lines[0]+'\n'+'\n'.join(line[8:] if line.startswith('        ') else line for line in lines[1:])+'\n'
          s=s.replace(marker,step+marker)
          s=s.replace('/tmp/fulfilment-http.txt; do', '/tmp/fulfilment-http.txt /tmp/shipping-baseline.txt /tmp/shipping-candidate.txt; do')
          p.write_text(s)
          manifest=Path('takeaway-theme/inc/bundled-plugins/manifest.json')
          data=json.loads(manifest.read_text());data['takeaway-os']['version']='1.3.13-rc.4';manifest.write_text(json.dumps(data,indent=2)+'\n')
          archive=manifest.parent/'takeaway-os.zip'
          with zipfile.ZipFile(archive) as old: names=old.namelist()
          assert len(names)==50 and all(n.startswith('takeaway-os/') and '..' not in Path(n).parts for n in names)
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in sorted(names):
              info=zipfile.ZipInfo(name,(2026,10,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o644<<16
              z.writestr(info,Path(name).read_bytes())
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            assert all(z.read(n)==Path(n).read_bytes() for n in z.namelist())
          print('PACKAGE SHA256',hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
          php tests/backend/run.php
          find takeaway-os tests -name '*.php' -print0 | xargs -0 -n1 php -l
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add takeaway-os takeaway-theme tests .github/workflows/backend-checks.yml
          git rm .shipping-change.b64 .github/workflows/apply-shipping-correction.yml
          git commit -m 'Use WooCommerce resolved addresses for delivery validation and preserve native shipping labels'
          git push origin HEAD:refs/heads/fix/backend-foundations-20260930
